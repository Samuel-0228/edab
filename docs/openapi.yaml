openapi: 3.0.3
info:
  title: Kerob Automation Platform API
  description: Production-grade event-driven automation platform API.
  version: 0.1.1
servers:
  - url: http://localhost:8080
    description: Local Server

paths:
  /health:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: Service is healthy

  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service dependencies and workers ready

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Metrics in Prometheus exposition format

  /api/v1/overview:
    get:
      summary: Get platform operational overview metrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operational status, execution counts, success rates

  /api/v1/workflows:
    get:
      summary: List all automations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of workflows
    post:
      summary: Create new automation workflow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: Workflow created

  /api/v1/workflows/{id}:
    get:
      summary: Get workflow by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow definition
    patch:
      summary: Update workflow configuration or toggle enabled state
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated workflow
    delete:
      summary: Delete workflow
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workflow deleted

  /api/v1/workflows/{id}/test:
    post:
      summary: Dry-run and test a workflow trace against synthetic or provided event payload
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dry_run
          in: query
          required: false
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type: { type: string }
                source_id: { type: string }
                payload: { type: object }
                dry_run: { type: boolean }
                mock_actions: { type: boolean }
      responses:
        '200':
          description: Step-by-step dry-run execution trace

  /api/v1/workflows/{id}/versions:
    get:
      summary: List revision history snapshots of a workflow
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of workflow version records

  /api/v1/workflows/{id}/versions/{version}:
    get:
      summary: Get specific workflow version snapshot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Workflow version snapshot
        '404':
          description: Version not found

  /api/v1/workflows/{id}/rollback/{version}:
    post:
      summary: Rollback workflow configuration to a previous version
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rollback successful

  /api/v1/workflows/{id}/diff:
    get:
      summary: Diff two workflow versions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
        - name: to
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Diff between versions

  /api/v1/workflows/{id}/export:
    get:
      summary: Export workflow definition as JSON or YAML
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, yaml]
      responses:
        '200':
          description: Exported definition in requested format

  /api/v1/workflows/import:
    post:
      summary: Import workflow from JSON or YAML definition
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
          application/x-yaml:
            schema:
              type: string
      responses:
        '201':
          description: Workflow imported successfully

  /api/v1/templates:
    get:
      summary: List built-in workflow template recipes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of workflow templates

  /api/v1/events/{id}/replay:
    post:
      summary: Replay an ingested event through automation engine
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bypass_idempotency: { type: boolean }
      responses:
        '200':
          description: Replay result

  /api/v1/events/replay-bulk:
    post:
      summary: Bulk replay multiple events
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_ids]
              properties:
                event_ids:
                  type: array
                  items: { type: string }
                bypass_idempotency: { type: boolean }
      responses:
        '200':
          description: Bulk replay results

  /api/v1/dead-letter/retry-bulk:
    post:
      summary: Bulk retry dead-letter failure records
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Retried count

  /api/v1/dead-letter/discard-bulk:
    post:
      summary: Bulk discard dead-letter failure records
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Discarded count

  /api/v1/integrations:
    get:
      summary: List integration capabilities catalog
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Catalog of supported integrations

  /api/v1/integrations/{id}:
    get:
      summary: Get integration manifest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Integration manifest details
        '404':
          description: Integration not found

  /api/v1/integrations/{id}/schema:
    get:
      summary: Get JSON Schema for an integration action or trigger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Integration JSON Schema definition
        '404':
          description: Integration not found

  /api/v1/connectors:
    get:
      summary: List registered connectors in the Extensible Connector SDK
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of connector manifests with declared capabilities

  /api/v1/connectors/{id}:
    get:
      summary: Get connector manifest by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connector manifest
        '404':
          description: Connector not found

  /api/v1/connectors/{id}/health:
    get:
      summary: Perform dynamic health check and probe latency for a connector
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: credential_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Health check result and latency metrics

  /api/v1/oauth/{connector}/authorize:
    get:
      summary: Initiate OAuth2 flow with CSRF state protection
      security:
        - BearerAuth: []
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Authorization URL and high-entropy state token

  /api/v1/oauth/{connector}/callback:
    post:
      summary: Exchange OAuth authorization code for encrypted tokens
      security:
        - BearerAuth: []
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, code]
              properties:
                state: { type: string }
                code: { type: string }
                redirect_uri: { type: string }
      responses:
        '201':
          description: Stored credential with masked token fields

  /api/v1/oauth/{connector}/refresh:
    post:
      summary: Rotate OAuth refresh tokens
      security:
        - BearerAuth: []
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id: { type: string }
      responses:
        '200':
          description: Updated credential with rotated tokens

  /api/v1/oauth/{connector}/revoke:
    post:
      summary: Revoke upstream OAuth token and delete credentials
      security:
        - BearerAuth: []
      parameters:
        - name: connector
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id]
              properties:
                credential_id: { type: string }
      responses:
        '200':
          description: Revocation confirmation

  /api/v1/credentials:
    get:
      summary: List stored credentials (masked)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of credentials with masked values
    post:
      summary: Store encrypted credentials (AES-256-GCM)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, integration, values]
              properties:
                name: { type: string }
                integration: { type: string }
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Credential securely created

  /api/v1/executions:
    get:
      summary: List execution runs
      security:
        - BearerAuth: []
      parameters:
        - name: workflow_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: List of execution runs

  /api/v1/executions/{id}:
    get:
      summary: Get execution details with step-by-step lifecycle timeline
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution run with granular steps

  /api/v1/executions/{id}/retry:
    post:
      summary: Retry a failed execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution re-queued or executed

  /api/v1/executions/{id}/pause:
    post:
      summary: Pause an in-flight or waiting execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution marked paused

  /api/v1/executions/{id}/resume:
    post:
      summary: Resume a paused execution from its last recorded step
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution resumed

  /api/v1/executions/{id}/cancel:
    post:
      summary: Cancel an active or paused execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution cancelled and active context terminated

  /api/v1/executions/{id}/compensate:
    post:
      summary: Trigger operator-initiated saga compensation rollback for an execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Execution compensated or compensation initiated

  /api/v1/approvals:
    get:
      summary: List pending and historical workflow approval steps
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, expired, escalated] }
        - name: workflow_id
          in: query
          schema: { type: string }
        - name: execution_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of approval records

  /api/v1/approvals/{id}:
    get:
      summary: Get details of a human approval step
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Approval record
        '404':
          description: Approval not found

  /api/v1/approvals/{id}/approve:
    post:
      summary: Approve a pending human approval step
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Approval accepted and execution resumed

  /api/v1/approvals/{id}/reject:
    post:
      summary: Reject a pending human approval step and trigger saga compensation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Approval rejected and saga compensation triggered

  /api/v1/approval-tokens/{token}:
    get:
      summary: Get safe preview of an approval using cryptographic token (no credentials/secrets)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Safe approval preview
        '404':
          description: Token not found or expired
    post:
      summary: Submit approval or rejection decision using cryptographic token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
                approver: { type: string }
      responses:
        '200':
          description: Decision applied successfully

  /api/v1/operations/stream:
    get:
      summary: Server-Sent Events stream for real-time operational execution updates
      security:
        - BearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          description: Optional API token for standard EventSource clients lacking Authorization headers
          schema: { type: string }
      responses:
        '200':
          description: Real-time event stream (text/event-stream)

  /api/v1/failures:
    get:
      summary: List dead-letter failures
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unrecoverable execution failures

  /api/v1/failures/{id}/retry:
    post:
      summary: Retry a failed dead-letter execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution reset for retry

  /api/v1/failures/{id}/discard:
    post:
      summary: Discard dead-letter failure record
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Failure discarded

  /webhooks/{id}:
    post:
      summary: Ingest inbound generic webhook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Webhook accepted and queued for workflow execution
        '401':
          description: Invalid secret token
        '413':
          description: Payload exceeds 1MB limit

  /api/v1/schemas:
    get:
      summary: List registered event schemas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of event schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSchema'
    post:
      summary: Register or evolve an event schema
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              properties:
                name: { type: string }
                schema_type: { type: string, enum: [json_schema, protobuf] }
                definition: { type: string }
                compatibility: { type: string, enum: [BACKWARD, FORWARD, FULL, NONE] }
                description: { type: string }
      responses:
        '201':
          description: Schema registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchema'
        '400':
          description: Invalid schema definition or compatibility violation

  /api/v1/schemas/{name}:
    get:
      summary: Get latest version of a schema by name
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchema'
        '404':
          description: Schema not found

  /api/v1/schemas/{name}/versions:
    get:
      summary: List all versions of a schema by name
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Version history for schema
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSchema'

  /api/v1/schemas/{name}/validate:
    post:
      summary: Validate an event payload against schema
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: object }
      responses:
        '200':
          description: Payload is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  errors: { type: array, items: { type: object } }
        '422':
          description: Payload failed schema validation

  /api/v1/streams/publish:
    post:
      summary: Publish a partitioned record to durable stream
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, payload]
              properties:
                topic: { type: string }
                ordering_key: { type: string }
                source_id: { type: string }
                event_type: { type: string }
                payload: { type: object }
                headers:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Record committed to partition log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamPublishResult'

  /api/v1/streams/offsets:
    get:
      summary: Get consumer partition offsets
      security:
        - BearerAuth: []
      parameters:
        - name: group_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Consumer offsets list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamConsumerOffset'

  /api/v1/streams/replay:
    post:
      summary: Historical stream replay
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                topic: { type: string }
                source_id: { type: string }
                event_type: { type: string }
                since: { type: string, format: date-time }
                until: { type: string, format: date-time }
                bypass_idempotency: { type: boolean }
      responses:
        '200':
          description: Replay execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamReplayResult'

  /api/v1/streams/dlq:
    get:
      summary: List dead-letter stream records
      security:
        - BearerAuth: []
      parameters:
        - name: topic
          in: query
          schema: { type: string }
        - name: resolved
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: DLQ stream events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StreamDeadLetterEvent'

  /api/v1/streams/dlq/{id}/retry:
    post:
      summary: Retry and resolve a dead-letter event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Retried and resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  event: { type: object }
                  executions: { type: array, items: { type: object } }

  /api/v1/governance/policy:
    get:
      summary: Get active tenant governance policy
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active governance policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernancePolicy'
    put:
      summary: Upsert tenant governance policy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernancePolicy'
      responses:
        '200':
          description: Updated governance policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernancePolicy'

  /api/v1/governance/policy/validate:
    post:
      summary: Dry-run validate candidate workflow against governance policy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '200':
          description: Policy validation outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidationResult'

  /api/v1/governance/audit/verify:
    get:
      summary: Cryptographically verify tenant audit trail hash chain
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Verification report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerificationResult'

  /api/v1/governance/retention/prune:
    post:
      summary: Clean up audit records exceeding configured data retention
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Retention prune report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPruneResult'

  /api/v1/audit-logs/export:
    get:
      summary: Export audit logs in JSON or CSV format
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv], default: json }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: action
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Exported audit logs
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
            text/csv:
              schema:
                type: string

  /api/v1/ai/status:
    get:
      summary: Get AI assistance subsystem operational status and quota
      security:
        - BearerAuth: []
      responses:
        '200':
          description: AI status report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatusResponse'

  /api/v1/ai/draft-workflow:
    post:
      summary: Draft workflow JSON definition using AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIDraftWorkflowRequest'
      responses:
        '201':
          description: Created AI proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/map-fields:
    post:
      summary: Propose payload field mappings using AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIMapFieldsRequest'
      responses:
        '201':
          description: Field mapping proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/generate-conditions:
    post:
      summary: Generate step condition tree from criteria using AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateConditionsRequest'
      responses:
        '201':
          description: Condition generation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/suggest-transformations:
    post:
      summary: Suggest payload transformation steps using AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISuggestTransformationRequest'
      responses:
        '201':
          description: Transformation suggestion proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/explain-failure:
    post:
      summary: Diagnose execution failure using AI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIExplainFailureRequest'
      responses:
        '201':
          description: Failure explanation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/proposals:
    get:
      summary: List AI proposals for the tenant
      security:
        - BearerAuth: []
      parameters:
        - name: task_type
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Array of AI proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/proposals/{id}:
    get:
      summary: Retrieve a single AI proposal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Proposal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

  /api/v1/ai/proposals/{id}/accept:
    post:
      summary: Explicitly approve an AI proposal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: create_workflow
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Accepted proposal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAcceptProposalResult'

  /api/v1/ai/proposals/{id}/reject:
    post:
      summary: Explicitly reject an AI proposal
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Rejected proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProposal'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    Workflow:
      type: object
      required: [name, trigger, actions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: true }
        trigger:
          type: object
          required: [type]
          properties:
            type: { type: string }
            event_types:
              type: array
              items: { type: string }
        conditions:
          $ref: '#/components/schemas/Condition'
        transformations:
          $ref: '#/components/schemas/Transformation'
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "Unique step identifier for pipeline referencing (e.g. step_1)" }
              name: { type: string, description: "Descriptive step label" }
              type: { type: string, enum: [action, branch, for_each, delay, parallel], default: action }
              integration: { type: string }
              action_type: { type: string }
              credential_id: { type: string }
              on_error: { type: string, enum: [fail, continue, skip_rest], default: fail }
              max_retries: { type: integer, default: 0 }
              backoff_seconds: { type: integer, default: 0 }
              timeout_seconds: { type: integer, default: 30 }
              cases:
                type: array
                items:
                  type: object
                  properties:
                    when: { type: object }
                    steps: { type: array, items: { type: object } }
              default:
                type: array
                items: { type: object }
              items: { type: string, description: "Path to items array for for_each" }
              item_var: { type: string, default: "item" }
              index_var: { type: string, default: "index" }
              max_iterations: { type: integer, default: 100 }
              steps: { type: array, items: { type: object } }
              concurrency: { type: integer, default: 5 }
              duration: { type: string, description: "Delay duration string (e.g. 5s, 1m)" }
              duration_seconds: { type: integer }
              config: { type: object }
        max_retries: { type: integer, default: 3 }
        timeout_seconds: { type: integer, default: 30 }

    Condition:
      type: object
      properties:
        field: { type: string }
        operator:
          type: string
          enum: [equals, not_equals, contains, not_contains, starts_with, ends_with, matches, regex, exists, not_exists, greater_than, less_than, greater_or_equal, less_or_equal, between, in, not_in, is_empty, is_not_empty, time_window]
        value: {}
        quantifier:
          type: string
          enum: [any, all]
        logical:
          type: string
          enum: [and, or, not]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Condition'

    Transformation:
      type: object
      properties:
        type:
          type: string
          enum: [template, mapping, json, passthrough, pick, omit, flatten, merge, compute]
        template: { type: string }
        output_key: { type: string }
        field_maps:
          type: object
          additionalProperties: { type: string }
        defaults:
          type: object
        pick_keys:
          type: array
          items: { type: string }
        omit_keys:
          type: array
          items: { type: string }
        data:
          type: object
        compute:
          type: array
          items:
            type: object
            required: [target, op, args]
            properties:
              target: { type: string }
              op: { type: string, enum: [add, sub, mul, div, concat] }
              args: { type: array, items: { type: string } }

    APIError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        request_id: { type: string }
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    EventSchema:
      type: object
      required: [id, name, version, schema_type, definition, compatibility, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        version: { type: integer }
        schema_type: { type: string, enum: [json_schema, protobuf] }
        definition: { type: string }
        compatibility: { type: string, enum: [BACKWARD, FORWARD, FULL, NONE] }
        description: { type: string }
        created_at: { type: string, format: date-time }

    StreamPublishResult:
      type: object
      required: [id, topic, partition, offset, timestamp]
      properties:
        id: { type: string }
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer }
        timestamp: { type: string, format: date-time }

    StreamConsumerOffset:
      type: object
      required: [group_id, topic, partition, offset, committed_at]
      properties:
        group_id: { type: string }
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer }
        committed_at: { type: string, format: date-time }

    StreamDeadLetterEvent:
      type: object
      required: [id, topic, partition, offset, event_id, event_type, error_reason, retry_count, resolved, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        topic: { type: string }
        partition: { type: integer }
        offset: { type: integer }
        event_id: { type: string }
        ordering_key: { type: string }
        event_type: { type: string }
        payload: { type: object }
        error_reason: { type: string }
        retry_count: { type: integer }
        resolved: { type: boolean }
        created_at: { type: string, format: date-time }

    StreamReplayResult:
      type: object
      required: [total_matched, replayed, event_ids, execution_ids]
      properties:
        total_matched: { type: integer }
        replayed: { type: integer }
        event_ids:
          type: array
          items: { type: string }
        execution_ids:
          type: array
          items: { type: string }

    GovernancePolicy:
      type: object
      required: [tenant_id, allowed_connectors, allowed_outbound_domains, max_workflow_retries, max_payload_size_bytes, data_retention_days, enforcement_mode]
      properties:
        tenant_id: { type: string }
        allowed_connectors: { type: array, items: { type: string } }
        allowed_outbound_domains: { type: array, items: { type: string } }
        max_workflow_retries: { type: integer, default: 5 }
        max_payload_size_bytes: { type: integer, format: int64, default: 1048576 }
        data_retention_days: { type: integer, default: 90 }
        require_approval_irreversible: { type: boolean, default: false }
        mask_pii: { type: boolean, default: true }
        mask_secrets: { type: boolean, default: true }
        blocked_keywords: { type: array, items: { type: string } }
        allowed_environments: { type: array, items: { type: string } }
        enforcement_mode: { type: string, enum: [enforce, audit], default: enforce }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyViolation:
      type: object
      required: [rule, field, message]
      properties:
        rule: { type: string }
        field: { type: string }
        message: { type: string }
        details: { type: object }

    PolicyValidationResult:
      type: object
      required: [valid, violations, tenant_id]
      properties:
        valid: { type: boolean }
        violations:
          type: array
          items:
            $ref: '#/components/schemas/PolicyViolation'
        tenant_id: { type: string }

    AuditVerificationResult:
      type: object
      required: [valid, tenant_id, total_records, verified_at]
      properties:
        valid: { type: boolean }
        tenant_id: { type: string }
        total_records: { type: integer }
        verified_at: { type: string, format: date-time }
        broken_at_sequence: { type: integer, format: int64 }
        error_message: { type: string }

    RetentionPruneResult:
      type: object
      required: [pruned_audit_logs, retention_days, cutoff, tenant_id]
      properties:
        pruned_audit_logs: { type: integer, format: int64 }
        retention_days: { type: integer }
        cutoff: { type: string, format: date-time }
        tenant_id: { type: string }

    AIStatusResponse:
      type: object
      required: [enabled, provider, model, tenant_id]
      properties:
        enabled: { type: boolean }
        provider: { type: string }
        model: { type: string }
        tenant_id: { type: string }
        opted_out: { type: boolean }
        max_tokens: { type: integer }
        timeout_seconds: { type: integer }
        available_tasks:
          type: array
          items: { type: string }

    AIValidationResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    AIProposal:
      type: object
      required: [id, tenant_id, task, status, prompt, validation, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        task:
          type: string
          enum: [draft_workflow, map_fields, generate_conditions, suggest_transformation, explain_failure]
        status:
          type: string
          enum: [pending_approval, accepted, rejected]
        prompt: { type: string }
        explanation: { type: string }
        content: { type: object }
        validation:
          $ref: '#/components/schemas/AIValidationResult'
        model_used: { type: string }
        tokens_used: { type: integer }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        decided_by: { type: string }

    AIDraftWorkflowRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        allowed_connectors:
          type: array
          items: { type: string }
        context: { type: object }

    AIMapFieldsRequest:
      type: object
      properties:
        source_schema: { type: object }
        target_schema: { type: object }
        sample_payload: { type: object }
        description: { type: string }

    AIGenerateConditionsRequest:
      type: object
      required: [criteria]
      properties:
        criteria: { type: string }
        sample_payload: { type: object }

    AISuggestTransformationRequest:
      type: object
      required: [input_payload]
      properties:
        input_payload: { type: object }
        desired_output: { type: object }
        goal: { type: string }

    AIExplainFailureRequest:
      type: object
      required: [workflow_id, execution_id, error]
      properties:
        workflow_id: { type: string }
        execution_id: { type: string }
        step_id: { type: string }
        step_type: { type: string }
        error: { type: string }
        step_input: { type: object }
        step_output: { type: object }

    AIAcceptProposalResult:
      type: object
      required: [proposal]
      properties:
        proposal:
          $ref: '#/components/schemas/AIProposal'
        applied_workflow_id: { type: string }

