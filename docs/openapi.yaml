openapi: 3.0.3
info:
  title: Kerob Automation Platform API
  description: Production-grade event-driven automation platform API.
  version: 0.1.1
servers:
  - url: http://localhost:8080
    description: Local Server

paths:
  /health:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: Service is healthy

  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service dependencies and workers ready

  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        '200':
          description: Metrics in Prometheus exposition format

  /api/v1/overview:
    get:
      summary: Get platform operational overview metrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Operational status, execution counts, success rates

  /api/v1/workflows:
    get:
      summary: List all automations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of workflows
    post:
      summary: Create new automation workflow
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: Workflow created

  /api/v1/workflows/{id}:
    get:
      summary: Get workflow by ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow definition
    patch:
      summary: Update workflow configuration or toggle enabled state
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated workflow
    delete:
      summary: Delete workflow
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Workflow deleted

  /api/v1/integrations:
    get:
      summary: List integration capabilities catalog
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Catalog of supported integrations

  /api/v1/integrations/{id}:
    get:
      summary: Get integration manifest
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Integration manifest details
        '404':
          description: Integration not found

  /api/v1/integrations/{id}/schema:
    get:
      summary: Get JSON Schema for an integration action or trigger
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Integration JSON Schema definition
        '404':
          description: Integration not found

  /api/v1/credentials:
    get:
      summary: List stored credentials (masked)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of credentials with masked values
    post:
      summary: Store encrypted credentials (AES-256-GCM)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, integration, values]
              properties:
                name: { type: string }
                integration: { type: string }
                values:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201':
          description: Credential securely created

  /api/v1/executions:
    get:
      summary: List execution runs
      security:
        - BearerAuth: []
      parameters:
        - name: workflow_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: List of execution runs

  /api/v1/executions/{id}:
    get:
      summary: Get execution details with step-by-step lifecycle timeline
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution run with granular steps

  /api/v1/failures:
    get:
      summary: List dead-letter failures
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unrecoverable execution failures

  /api/v1/failures/{id}/retry:
    post:
      summary: Retry a failed dead-letter execution
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Execution reset for retry

  /api/v1/failures/{id}/discard:
    post:
      summary: Discard dead-letter failure record
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Failure discarded

  /webhooks/{id}:
    post:
      summary: Ingest inbound generic webhook
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Webhook accepted and queued for workflow execution
        '401':
          description: Invalid secret token
        '413':
          description: Payload exceeds 1MB limit

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  schemas:
    Workflow:
      type: object
      required: [name, trigger, actions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: true }
        trigger:
          type: object
          required: [type]
          properties:
            type: { type: string }
            event_types:
              type: array
              items: { type: string }
        conditions:
          $ref: '#/components/schemas/Condition'
        transformations:
          $ref: '#/components/schemas/Transformation'
        actions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "Unique step identifier for pipeline referencing (e.g. step_1)" }
              name: { type: string, description: "Descriptive step label" }
              type: { type: string, enum: [action, branch, for_each, delay, parallel], default: action }
              integration: { type: string }
              action_type: { type: string }
              credential_id: { type: string }
              on_error: { type: string, enum: [fail, continue, skip_rest], default: fail }
              max_retries: { type: integer, default: 0 }
              backoff_seconds: { type: integer, default: 0 }
              timeout_seconds: { type: integer, default: 30 }
              cases:
                type: array
                items:
                  type: object
                  properties:
                    when: { type: object }
                    steps: { type: array, items: { type: object } }
              default:
                type: array
                items: { type: object }
              items: { type: string, description: "Path to items array for for_each" }
              item_var: { type: string, default: "item" }
              index_var: { type: string, default: "index" }
              max_iterations: { type: integer, default: 100 }
              steps: { type: array, items: { type: object } }
              concurrency: { type: integer, default: 5 }
              duration: { type: string, description: "Delay duration string (e.g. 5s, 1m)" }
              duration_seconds: { type: integer }
              config: { type: object }
        max_retries: { type: integer, default: 3 }
        timeout_seconds: { type: integer, default: 30 }

    Condition:
      type: object
      properties:
        field: { type: string }
        operator:
          type: string
          enum: [equals, not_equals, contains, not_contains, starts_with, ends_with, matches, regex, exists, not_exists, greater_than, less_than, greater_or_equal, less_or_equal, between, in, not_in, is_empty, is_not_empty, time_window]
        value: {}
        quantifier:
          type: string
          enum: [any, all]
        logical:
          type: string
          enum: [and, or, not]
        rules:
          type: array
          items:
            $ref: '#/components/schemas/Condition'

    Transformation:
      type: object
      properties:
        type:
          type: string
          enum: [template, mapping, json, passthrough, pick, omit, flatten, merge, compute]
        template: { type: string }
        output_key: { type: string }
        field_maps:
          type: object
          additionalProperties: { type: string }
        defaults:
          type: object
        pick_keys:
          type: array
          items: { type: string }
        omit_keys:
          type: array
          items: { type: string }
        data:
          type: object
        compute:
          type: array
          items:
            type: object
            required: [target, op, args]
            properties:
              target: { type: string }
              op: { type: string, enum: [add, sub, mul, div, concat] }
              args: { type: array, items: { type: string } }

    APIError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        request_id: { type: string }
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
