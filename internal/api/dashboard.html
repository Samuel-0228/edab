<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kerob — Event-Driven Automation Platform</title>
  <style>
    :root {
      --bg: #09090b;
      --sidebar: #121214;
      --card: #18181b;
      --card-hover: #202024;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #10b981;
      --accent-dim: rgba(16, 185, 129, 0.15);
      --accent-hover: #059669;
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-dim: rgba(245, 158, 11, 0.15);
      --blue: #3b82f6;
      --blue-dim: rgba(59, 130, 246, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }
    aside {
      width: 240px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 13px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .nav-links {
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .nav-item:hover {
      color: var(--text);
      background: var(--card);
    }
    .nav-item.active {
      color: var(--text);
      background: var(--card);
      border-left: 2px solid var(--accent);
    }
    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg);
    }
    header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--sidebar);
    }
    .header-title h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    .header-title p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .content { padding: 28px; display: flex; flex-direction: column; gap: 24px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .badge-success { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent); }
    .badge-failed { background: var(--danger-dim); color: var(--danger); border: 1px solid var(--danger); }
    .badge-running { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
    .badge-warning { background: var(--warning-dim); color: var(--warning); border: 1px solid var(--warning); }
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
    }
    .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
    .stat-val { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .card-title { font-size: 14px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--card-hover); }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); color: #000; border: none; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: var(--danger-dim); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal {
      background: var(--sidebar);
      border: 1px solid var(--border);
      border-radius: 8px;
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
    input, select, textarea {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; font-family: monospace; font-size: 12px; }
    .code-box {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      overflow-x: auto;
      white-space: pre-wrap;
      color: #38bdf8;
    }
    .timeline { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    .timeline-step {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 12px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline-step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 12px;
    }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .catalog-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .catalog-card h3 { font-size: 15px; font-weight: 600; }
    .catalog-card p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <div class="brand-logo">K</div>
      <div class="brand-title">Kerob</div>
    </div>
    <div class="nav-links">
      <div class="nav-item active" onclick="switchTab('overview')">Overview</div>
      <div class="nav-item" onclick="switchTab('workflows')">Automations</div>
      <div class="nav-item" onclick="switchTab('integrations')">Integrations</div>
      <div class="nav-item" onclick="switchTab('executions')">Executions</div>
      <div class="nav-item" onclick="switchTab('failures')">Dead-Letter</div>
      <div class="nav-item" onclick="switchTab('events')">Events</div>
      <div class="nav-item" onclick="switchTab('credentials')">Credentials</div>
      <div class="nav-item" onclick="switchTab('settings')">Settings</div>
    </div>
    <div class="sidebar-footer">
      <span>v0.1.0 • Engine Ready</span>
      <span class="badge badge-success">Live</span>
    </div>
  </aside>

  <main>
    <header>
      <div class="header-title">
        <h2 id="page-title">Overview</h2>
        <p id="page-subtitle">Platform operational state & execution metrics</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="refreshCurrentTab()">Refresh</button>
        <button class="btn btn-primary" onclick="openCreateWorkflowModal()">+ New Automation</button>
      </div>
    </header>

    <div class="content" id="main-content">
      <!-- Injected dynamically by switchTab() -->
    </div>
  </main>

  <!-- Create Workflow Modal -->
  <div class="modal-overlay" id="workflow-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Create Automation Workflow</h3>
        <button class="btn" onclick="closeModal('workflow-modal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Workflow Name</label>
          <input type="text" id="wf-name" placeholder="e.g. Telegram Jobs to Discord">
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="wf-desc" placeholder="Forward tech job openings...">
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>WHEN Trigger</label>
            <select id="wf-trigger-type">
              <option value="telegram">Telegram (Messages & Albums)</option>
              <option value="github">GitHub Webhook</option>
              <option value="rss">RSS / Atom Feed</option>
              <option value="webhook">Inbound Webhook</option>
            </select>
          </div>
          <div class="form-group">
            <label>THEN Action</label>
            <select id="wf-action-type">
              <option value="discord">Discord (Webhook Embed)</option>
              <option value="telegram">Telegram (Message / Copy)</option>
              <option value="http">Generic HTTP Request</option>
              <option value="github">GitHub Create Issue</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>IF Conditions (JSON Rule, optional)</label>
          <textarea id="wf-conditions" placeholder='{"field":"payload.text","operator":"contains","value":"job"}'></textarea>
        </div>
        <div class="form-group">
          <label>Action Configuration (JSON)</label>
          <textarea id="wf-action-config" placeholder='{"webhook_url":"https://discord.com/api/webhooks/...","content":"{{payload.text}}"}'></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('workflow-modal')">Cancel</button>
        <button class="btn btn-primary" onclick="submitCreateWorkflow()">Create Automation</button>
      </div>
    </div>
  </div>

  <!-- Execution Details Modal -->
  <div class="modal-overlay" id="execution-modal">
    <div class="modal" style="max-width:720px;">
      <div class="modal-header">
        <h3>Execution Timeline</h3>
        <button class="btn" onclick="closeModal('execution-modal')">✕</button>
      </div>
      <div class="modal-body" id="execution-detail-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('execution-modal')">Close</button>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'overview';

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNav = Array.from(document.querySelectorAll('.nav-item')).find(el => el.textContent.toLowerCase().includes(tab.toLowerCase()));
      if (activeNav) activeNav.classList.add('active');

      const titleMap = {
        overview: ['Overview', 'Platform operational state & execution metrics'],
        workflows: ['Automations', 'Active event-driven workflow rules'],
        integrations: ['Integrations Catalog', 'Supported source adapters and delivery actions'],
        executions: ['Execution History', 'Audit logs and granular step timelines'],
        failures: ['Dead-Letter Queue', 'Unrecovered executions requiring inspection or retry'],
        events: ['Events Stream', 'Normalized incoming events and payload inspector'],
        credentials: ['Credentials Store', 'AES-256 encrypted integration tokens'],
        settings: ['System Settings', 'Liveness, Prometheus metrics, and runtime status']
      };

      const [title, sub] = titleMap[tab] || ['Kerob', 'Automation Platform'];
      document.getElementById('page-title').textContent = title;
      document.getElementById('page-subtitle').textContent = sub;

      renderTab(tab);
    }

    function refreshCurrentTab() {
      renderTab(currentTab);
    }

    async function fetchAPI(url, options = {}) {
      try {
        const res = await fetch(url, options);
        if (!res.ok) {
          const err = await res.json().catch(() => ({error: res.statusText}));
          throw new Error(err.error || res.statusText);
        }
        return await res.json();
      } catch (e) {
        console.error('API Error:', e);
        throw e;
      }
    }

    async function renderTab(tab) {
      const container = document.getElementById('main-content');
      container.innerHTML = '<div style="color:var(--text-muted)">Loading platform data...</div>';

      try {
        if (tab === 'overview') await renderOverview(container);
        else if (tab === 'workflows') await renderWorkflows(container);
        else if (tab === 'integrations') await renderIntegrations(container);
        else if (tab === 'executions') await renderExecutions(container);
        else if (tab === 'failures') await renderFailures(container);
        else if (tab === 'events') await renderEvents(container);
        else if (tab === 'credentials') await renderCredentials(container);
        else if (tab === 'settings') await renderSettings(container);
      } catch (err) {
        container.innerHTML = '<div class="card" style="border-color:var(--danger); color:var(--danger)">Error loading data: ' + err.message + '</div>';
      }
    }

    async function renderOverview(container) {
      const data = await fetchAPI('/api/v1/overview');
      container.innerHTML = `
        <div class="grid-stats">
          <div class="stat-card">
            <div class="stat-label">Active Automations</div>
            <div class="stat-val" style="color:var(--accent)">${data.active_workflows}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Executions</div>
            <div class="stat-val">${data.executions_total}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Success Rate</div>
            <div class="stat-val" style="color:var(--accent)">${data.success_rate.toFixed(1)}%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Dead-Letter Failures</div>
            <div class="stat-val" style="color:${data.dead_letter_count > 0 ? 'var(--danger)' : 'var(--text-muted)'}">${data.dead_letter_count}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">Recent Workflow Executions</div>
            <button class="btn" onclick="switchTab('executions')">View All</button>
          </div>
          <table>
            <thead>
              <tr><th>Workflow ID</th><th>Event ID</th><th>Status</th><th>Duration</th><th>Completed At</th><th>Action</th></tr>
            </thead>
            <tbody>
              ${(data.recent_executions && data.recent_executions.length > 0) ? data.recent_executions.map(e => `
                <tr>
                  <td><code>${e.workflow_id.slice(0,8)}...</code></td>
                  <td><code>${e.event_id.slice(0,8)}...</code></td>
                  <td><span class="badge badge-${e.status === 'success' ? 'success' : (e.status === 'failed' ? 'failed' : 'running')}">${e.status}</span></td>
                  <td>${e.duration_ms} ms</td>
                  <td>${e.completed_at ? new Date(e.completed_at).toLocaleTimeString() : 'In Progress'}</td>
                  <td><button class="btn" onclick="inspectExecution('${e.id}')">Inspect Timeline</button></td>
                </tr>
              `).join('') : '<tr><td colspan="6" style="color:var(--text-muted); text-align:center;">No executions recorded yet. Connect a trigger to start automating!</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderWorkflows(container) {
      const list = await fetchAPI('/api/v1/workflows');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Configured Workflows (${list.length})</div>
            <button class="btn btn-primary" onclick="openCreateWorkflowModal()">+ New Automation</button>
          </div>
          <table>
            <thead>
              <tr><th>Name</th><th>WHEN Trigger</th><th>THEN Actions</th><th>Status</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody>
              ${list.length > 0 ? list.map(wf => `
                <tr>
                  <td><strong>${wf.name}</strong><br><span style="color:var(--text-muted); font-size:11px;">${wf.description || 'No description'}</span></td>
                  <td><code>${wf.trigger.type}</code></td>
                  <td>${wf.actions.map(a => `<code>${a.integration}</code>`).join(', ')}</td>
                  <td><span class="badge badge-${wf.enabled ? 'success' : 'warning'}">${wf.enabled ? 'Active' : 'Disabled'}</span></td>
                  <td>${new Date(wf.created_at).toLocaleDateString()}</td>
                  <td>
                    <button class="btn" onclick="toggleWorkflow('${wf.id}', ${!wf.enabled})">${wf.enabled ? 'Disable' : 'Enable'}</button>
                    <button class="btn btn-danger" onclick="deleteWorkflow('${wf.id}')">Delete</button>
                  </td>
                </tr>
              `).join('') : '<tr><td colspan="6" style="color:var(--text-muted); text-align:center;">No workflows created yet. Click "+ New Automation" to build one!</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderIntegrations(container) {
      const catalog = await fetchAPI('/api/v1/integrations');
      container.innerHTML = `
        <div class="catalog-grid">
          ${catalog.map(item => `
            <div class="catalog-card">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <h3>${item.name}</h3>
                  <span class="badge badge-success">Ready</span>
                </div>
                <p>${item.description}</p>
                <div style="margin-top:12px; font-size:11px; color:var(--text-muted)">
                  <strong>Triggers:</strong> ${item.triggers.length > 0 ? item.triggers.map(t => t.name).join(', ') : 'None'}<br>
                  <strong>Actions:</strong> ${item.actions.length > 0 ? item.actions.map(a => a.name).join(', ') : 'None'}
                </div>
              </div>
              <div style="margin-top:10px;">
                <button class="btn" style="width:100%" onclick="switchTab('credentials')">Manage Credentials</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function renderExecutions(container) {
      const list = await fetchAPI('/api/v1/executions?limit=50');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Execution Runs (${list.length})</div>
          </div>
          <table>
            <thead>
              <tr><th>Execution ID</th><th>Workflow</th><th>Event</th><th>Status</th><th>Attempts</th><th>Duration</th><th>Started At</th><th>Details</th></tr>
            </thead>
            <tbody>
              ${list.length > 0 ? list.map(e => `
                <tr>
                  <td><code>${e.id.slice(0,8)}...</code></td>
                  <td><code>${e.workflow_id.slice(0,8)}...</code></td>
                  <td><code>${e.event_id.slice(0,8)}...</code></td>
                  <td><span class="badge badge-${e.status === 'success' ? 'success' : (e.status === 'failed' ? 'failed' : 'running')}">${e.status}</span></td>
                  <td>${e.attempts} / ${e.max_attempts}</td>
                  <td>${e.duration_ms} ms</td>
                  <td>${new Date(e.started_at).toLocaleTimeString()}</td>
                  <td><button class="btn" onclick="inspectExecution('${e.id}')">Timeline</button></td>
                </tr>
              `).join('') : '<tr><td colspan="8" style="color:var(--text-muted); text-align:center;">No executions recorded yet.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function inspectExecution(id) {
      const exec = await fetchAPI('/api/v1/executions/' + id);
      const modal = document.getElementById('execution-detail-body');

      modal.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
          <div>
            <strong>Execution:</strong> <code>${exec.id}</code><br>
            <span style="font-size:11px; color:var(--text-muted)">Workflow: ${exec.workflow_id} | Event: ${exec.event_id}</span>
          </div>
          <div><span class="badge badge-${exec.status === 'success' ? 'success' : 'failed'}">${exec.status}</span></div>
        </div>

        ${exec.error ? '<div class="card" style="border-color:var(--danger); color:var(--danger); margin-bottom:12px;">Error: ' + exec.error + '</div>' : ''}

        <h4 style="font-size:13px; margin-bottom:8px;">Execution Lifecycle Timeline</h4>
        <div class="timeline">
          ${(exec.steps && exec.steps.length > 0) ? exec.steps.map(s => `
            <div class="timeline-step">
              <div class="timeline-step-header">
                <span>[${s.step_type.toUpperCase()}] ${s.name}</span>
                <span class="badge badge-${s.status === 'success' ? 'success' : (s.status === 'skipped' ? 'warning' : 'failed')}">${s.status} (${s.duration_ms} ms)</span>
              </div>
              ${s.error ? '<div style="color:var(--danger); font-size:11px;">Error: ' + s.error + '</div>' : ''}
              ${s.output ? '<div class="code-box">' + JSON.stringify(s.output, null, 2) + '</div>' : ''}
            </div>
          `).join('') : '<div style="color:var(--text-muted)">No granular steps recorded.</div>'}
        </div>
      `;

      openModal('execution-modal');
    }

    async function renderFailures(container) {
      const list = await fetchAPI('/api/v1/failures');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Dead-Letter Failures (${list.length})</div>
          </div>
          <table>
            <thead>
              <tr><th>Failed At</th><th>Workflow ID</th><th>Execution ID</th><th>Error</th><th>Attempts</th><th>Actions</th></tr>
            </thead>
            <tbody>
              ${list.length > 0 ? list.map(f => `
                <tr>
                  <td>${new Date(f.failed_at).toLocaleTimeString()}</td>
                  <td><code>${f.workflow_id.slice(0,8)}...</code></td>
                  <td><code>${f.execution_id.slice(0,8)}...</code></td>
                  <td style="color:var(--danger); font-family:monospace; font-size:11px;">${f.error}</td>
                  <td>${f.attempts}</td>
                  <td>
                    <button class="btn btn-primary" onclick="retryFailure('${f.id}')">Retry</button>
                    <button class="btn btn-danger" onclick="discardFailure('${f.id}')">Discard</button>
                  </td>
                </tr>
              `).join('') : '<tr><td colspan="6" style="color:var(--text-muted); text-align:center;">No unresolved failures in dead-letter queue. Clean state!</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderEvents(container) {
      const list = await fetchAPI('/api/v1/events?limit=50');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Normalized Events Stream (${list.length})</div>
          </div>
          <table>
            <thead>
              <tr><th>Timestamp</th><th>Event Type</th><th>Source ID</th><th>External ID</th><th>Payload Preview</th></tr>
            </thead>
            <tbody>
              ${list.length > 0 ? list.map(ev => `
                <tr>
                  <td>${new Date(ev.created_at).toLocaleTimeString()}</td>
                  <td><code>${ev.event_type}</code></td>
                  <td><code>${ev.source_id}</code></td>
                  <td><code>${ev.external_event_id}</code></td>
                  <td><div class="code-box" style="max-height:80px">${JSON.stringify(ev.payload)}</div></td>
                </tr>
              `).join('') : '<tr><td colspan="5" style="color:var(--text-muted); text-align:center;">No events recorded yet.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderCredentials(container) {
      const list = await fetchAPI('/api/v1/credentials');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="card-title">Stored Credentials (${list.length})</div>
          </div>
          <table>
            <thead>
              <tr><th>Name</th><th>Integration</th><th>Key ID</th><th>Masked Secrets</th><th>Created At</th><th>Action</th></tr>
            </thead>
            <tbody>
              ${list.length > 0 ? list.map(c => `
                <tr>
                  <td><strong>${c.name}</strong></td>
                  <td><code>${c.integration}</code></td>
                  <td>${c.key_id}</td>
                  <td><div class="code-box">${JSON.stringify(c.masked_fields)}</div></td>
                  <td>${new Date(c.created_at).toLocaleDateString()}</td>
                  <td><button class="btn btn-danger" onclick="deleteCredential('${c.id}')">Delete</button></td>
                </tr>
              `).join('') : '<tr><td colspan="6" style="color:var(--text-muted); text-align:center;">No stored credentials. Added credentials are AES-256 encrypted at rest.</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    async function renderSettings(container) {
      const health = await fetchAPI('/health');
      const ready = await fetchAPI('/ready');
      container.innerHTML = `
        <div class="card" style="display:flex; flex-direction:column; gap:14px;">
          <div class="card-title">System Status & Observability</div>
          <div><strong>Liveness (/health):</strong> <span class="badge badge-success">${health.status}</span></div>
          <div><strong>Readiness (/ready):</strong> <span class="badge badge-success">${ready.status}</span></div>
          <div><strong>Metrics Endpoint:</strong> <a href="/metrics" target="_blank" style="color:var(--accent)">/metrics (Prometheus Format)</a></div>
          <div><strong>Platform Version:</strong> <code>v0.1.0 (Production Architecture)</code></div>
        </div>
      `;
    }

    async function toggleWorkflow(id, enable) {
      await fetchAPI('/api/v1/workflows/' + id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({enabled: enable})
      });
      refreshCurrentTab();
    }

    async function deleteWorkflow(id) {
      if (!confirm('Are you sure you want to delete this automation?')) return;
      await fetch('/api/v1/workflows/' + id, {method: 'DELETE'});
      refreshCurrentTab();
    }

    async function retryFailure(id) {
      await fetchAPI('/api/v1/failures/' + id + '/retry', {method: 'POST'});
      refreshCurrentTab();
    }

    async function discardFailure(id) {
      await fetchAPI('/api/v1/failures/' + id + '/discard', {method: 'POST'});
      refreshCurrentTab();
    }

    async function deleteCredential(id) {
      if (!confirm('Are you sure you want to delete this credential?')) return;
      await fetch('/api/v1/credentials/' + id, {method: 'DELETE'});
      refreshCurrentTab();
    }

    function openCreateWorkflowModal() {
      openModal('workflow-modal');
    }

    async function submitCreateWorkflow() {
      const name = document.getElementById('wf-name').value.trim();
      const desc = document.getElementById('wf-desc').value.trim();
      const trigType = document.getElementById('wf-trigger-type').value;
      const actType = document.getElementById('wf-action-type').value;
      const condRaw = document.getElementById('wf-conditions').value.trim();
      const actConfigRaw = document.getElementById('wf-action-config').value.trim();

      if (!name) {
        alert('Workflow name is required');
        return;
      }

      let conditions = null;
      if (condRaw) {
        try { conditions = JSON.parse(condRaw); } catch (e) { alert('Invalid conditions JSON: ' + e.message); return; }
      }

      let actConfig = {};
      if (actConfigRaw) {
        try { actConfig = JSON.parse(actConfigRaw); } catch (e) { alert('Invalid action config JSON: ' + e.message); return; }
      }

      const payload = {
        name: name,
        description: desc,
        enabled: true,
        trigger: {
          type: trigType,
          event_types: ['*']
        },
        conditions: conditions,
        actions: [{
          integration: actType,
          action_type: actType === 'discord' ? 'send_message' : (actType === 'telegram' ? 'send_message' : (actType === 'github' ? 'create_issue' : 'http_request')),
          config: actConfig
        }]
      };

      try {
        await fetchAPI('/api/v1/workflows', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        closeModal('workflow-modal');
        switchTab('workflows');
      } catch (err) {
        alert('Error creating workflow: ' + err.message);
      }
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // Initialize
    renderOverview(document.getElementById('main-content'));
  </script>
</body>
</html>
