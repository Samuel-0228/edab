services:
  postgres:
    image: postgres:16-alpine
    container_name: automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kerob
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/automation?sslmode=disable
      PORT: "8080"
      WORKER_POLL_INTERVAL: "1s"
      WORKER_CONCURRENCY: "4"
      MAX_RETRIES: "3"
      INITIAL_BACKOFF: "2s"
      MAX_BACKOFF: "1m"
      LOG_LEVEL: "info"
      ENVIRONMENT: "production"
      API_TOKEN: ${API_TOKEN:?set API_TOKEN before starting the production service}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-30}
      TELEGRAM_MEDIA_GROUP_WINDOW: ${TELEGRAM_MEDIA_GROUP_WINDOW:-1s}
      TELEGRAM_RATE_GLOBAL: ${TELEGRAM_RATE_GLOBAL:-25}
      TELEGRAM_RATE_PER_CHAT: ${TELEGRAM_RATE_PER_CHAT:-1}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
