name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dependency-health:
    name: Dependency Health & Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Verify Go module tidy and sum synchronization
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify Go module integrity (go mod verify)
        run: go mod verify

      - name: Blocking vulnerability scan (govulncheck ./...)
        run: govulncheck ./...

      - name: Install and verify frontend dependencies (npm ci)
        run: cd frontend && npm ci

      - name: Verify frontend package-lock synchronization
        run: git diff --exit-code frontend/package.json frontend/package-lock.json

      - name: Blocking frontend security audit (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Enforce Go dependency freshness policy
        run: ./scripts/check-go-deps.sh --freshness-only

      - name: Enforce frontend dependency freshness policy
        run: ./scripts/check-frontend-deps.sh --freshness-only

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          check-latest: true
          cache: true

      - name: Check code formatting (gofmt)
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || :)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files found:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --config=.golangci.yml --timeout=5m

  frontend-quality:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Svelte TypeScript check (npm run check)
        run: cd frontend && npm run check

      - name: ESLint check (npm run lint)
        run: cd frontend && npm run lint

      - name: Prettier check (npm run format:check)
        run: cd frontend && npm run format:check

      - name: Run frontend unit & component tests (npm test)
        run: cd frontend && npm test

      - name: Production dashboard build
        run: cd frontend && npm run build

  backend-test-and-build:
    name: Backend Test, Coverage & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          check-latest: true
          cache: true

      - name: Run test suite with race detector
        run: go test -v -count=1 -race $(go list ./... | grep -v node_modules)

      - name: Enforce Go test coverage threshold (>=60.0%)
        run: |
          go test -coverprofile=coverage.out $(go list ./... | grep -v node_modules)
          coverage=$(go tool cover -func=coverage.out | grep total: | awk '{print substr($3, 1, length($3)-1)}')
          echo "=================================================="
          echo "Go Total Statement Coverage: ${coverage}%"
          echo "Required Minimum Threshold:   60.0%"
          echo "=================================================="
          awk -v cov="$coverage" 'BEGIN {
            if (cov + 0 < 60.0) {
              print "ERROR: Coverage " cov "% is strictly below 60.0% threshold. Failing CI."
              exit 1
            } else {
              print "SUCCESS: Coverage threshold passed (" cov "% >= 60.0%)"
              exit 0
            }
          }'

      - name: Build kerob binary
        run: CGO_ENABLED=0 go build -v -ldflags="-w -s" -o /dev/null ./cmd/server

      - name: Verify Docker build
        run: docker build -t kerob:test .
